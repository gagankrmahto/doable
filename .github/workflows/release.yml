name: Release Android app

# Push a version tag to publish:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test sync engine
        run: npm test

      - name: Copy web app into Android project
        run: npm run sync:android

      - name: Version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${V%%-*}"
          echo "DOABLE_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "DOABLE_VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See SETUP.md, step 4."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DOABLE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          DOABLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DOABLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DOABLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "Doable-${DOABLE_VERSION_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: Doable-*.apk
          generate_release_notes: true
          body: |
            ## Install on Android
            1. Download **Doable-${{ env.DOABLE_VERSION_NAME }}.apk** below on your phone.
            2. Open it and allow "Install unknown apps" for your browser if asked.
            3. Sign in with the same account you use on the website to sync.

            Already installed? Just install this one over it — your tasks are kept.
