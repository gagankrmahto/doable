<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Connect Claude · Doable</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f6f7fb; --surface: #fff; --text: #15171f; --text-2: #5b6170; --border: #e3e5ec; --accent: #7b68ee; --danger: #e5484d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --surface: #181b24; --text: #eef0f5; --text-2: #aab0bf; --border: #2a2f3b; } }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .logo { width: 52px; height: 52px; border-radius: 15px; margin: 0 auto; display: grid; place-items: center; background: linear-gradient(135deg, #8e7cf6, #c06ad6); }
    .logo svg { width: 26px; height: 26px; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; font-size: 13.5px; color: var(--text-2); }
    button { font: inherit; font-weight: 700; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    button:disabled { opacity: .6; }
    .err { color: var(--danger); min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9.5 16.5l4.2 4.2 8.8-9.4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>Connect Claude to Doable</h1>
    <p id="msg">Claude is asking to read and update your Doable. Sign in with the Google account that owns it to allow this.</p>
    <button id="go"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg><span>Continue with Google</span></button>
    <p class="err" id="err"></p>
    <p>You can disconnect at any time from Claude's connector settings.</p>
  </div>
  <script src="config.js"></script>
  <script src="vendor/firebase.js"></script>
  <script>
  (() => {
    const fb = window.firebaseSdk, cfg = window.DOABLE_CONFIG || {};
    const req = new URLSearchParams(location.hash.slice(1)).get('req');
    const $ = s => document.querySelector(s);
    const COMPLETE = location.origin + '/authorize/complete';
    if (!req || !fb || !cfg.firebase) { $('#msg').textContent = 'This link is incomplete. Start the connection again from Claude.'; $('#go').disabled = true; return; }
    const app = fb.initializeApp(cfg.firebase);
    const auth = fb.getAuth(app);
    async function finish(user) {
      $('#go').disabled = true; $('#msg').textContent = 'Connecting…'; $('#err').textContent = '';
      try {
        const idToken = await user.getIdToken(true);
        const r = await fetch(COMPLETE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ req, idToken }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Could not connect');
        $('#msg').textContent = 'Connected. Taking you back to Claude…';
        location.replace(j.redirect);
      } catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; $('#msg').textContent = 'Try again, or start over from Claude.'; }
    }
    $('#go').addEventListener('click', async () => {
      $('#err').textContent = '';
      try { const cred = await fb.signInWithPopup(auth, new fb.GoogleAuthProvider()); await finish(cred.user); }
      catch (e) { $('#err').textContent = e.code === 'auth/popup-closed-by-user' ? 'Sign-in was closed before it finished.' : (e.message || 'Sign-in failed'); }
    });
    // Already signed in on this browser: one click still required, so a stray link can't connect silently
    fb.onAuthStateChanged(auth, u => { if (u) $('#go').querySelector('span').textContent = `Continue as ${u.email}`; });
  })();
  </script>
</body>
</html>
